name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WinOldRecovery.slnx

      - name: Build
        run: dotnet build WinOldRecovery.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test WinOldRecovery.slnx --configuration Release --no-build --no-restore -m:1 --settings tests/ci.runsettings

      - name: Restore publish runtime packs
        run: >
          dotnet restore src/WinOldRecovery.App/WinOldRecovery.App.csproj
          --runtime win-x64
          -p:PublishReadyToRun=true

      - name: Publish single-file x64
        run: >
          dotnet publish src/WinOldRecovery.App/WinOldRecovery.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained
          --no-restore
          -p:PublishProfile=win-x64

      - name: Verify one published executable
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src/WinOldRecovery.App/bin/publish/win-x64 -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'WinOldRecovery.exe') {
            throw "Expected exactly one WinOldRecovery.exe; found $($files.Count) files."
          }
          Write-Host "Published $($files[0].Name) ($($files[0].Length) bytes)"

      - name: Upload unsigned x64 artifact
        uses: actions/upload-artifact@v6
        with:
          name: WinOldRecovery-win-x64
          path: src/WinOldRecovery.App/bin/publish/win-x64/WinOldRecovery.exe
          if-no-files-found: error

      - name: Restore ARM64 publish runtime packs
        run: >
          dotnet restore src/WinOldRecovery.App/WinOldRecovery.App.csproj
          --runtime win-arm64
          -p:PublishReadyToRun=true

      - name: Publish single-file ARM64
        run: >
          dotnet publish src/WinOldRecovery.App/WinOldRecovery.App.csproj
          --configuration Release
          --runtime win-arm64
          --self-contained
          --no-restore
          -p:PublishProfile=win-arm64

      - name: Upload unsigned ARM64 artifact
        uses: actions/upload-artifact@v6
        with:
          name: WinOldRecovery-win-arm64
          path: src/WinOldRecovery.App/bin/publish/win-arm64/WinOldRecovery.exe
          if-no-files-found: error
