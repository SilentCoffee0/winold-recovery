name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WinOldRecovery.slnx

      - name: Build
        run: dotnet build WinOldRecovery.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test WinOldRecovery.slnx --configuration Release --no-build --no-restore

      - name: Restore publish runtime packs
        run: >
          dotnet restore src/WinOldRecovery.App/WinOldRecovery.App.csproj
          --runtime win-x64
          -p:PublishReadyToRun=true

      - name: Publish single-file x64
        run: >
          dotnet publish src/WinOldRecovery.App/WinOldRecovery.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained
          --no-restore
          -p:PublishProfile=win-x64

      - name: Stage release assets
        shell: pwsh
        run: |
          $source = "src/WinOldRecovery.App/bin/publish/win-x64/WinOldRecovery.exe"
          if (-not (Test-Path $source)) {
            throw "Published executable was not found."
          }
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Copy-Item $source artifacts/release/WinOldRecovery.exe
          $hash = (Get-FileHash artifacts/release/WinOldRecovery.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path artifacts/release/WinOldRecovery.exe.sha256 -Value "$hash  WinOldRecovery.exe" -NoNewline
          Get-Content artifacts/release/WinOldRecovery.exe.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          artifacts/release/WinOldRecovery.exe
          artifacts/release/WinOldRecovery.exe.sha256
          --title "WinOld Recovery ${{ github.ref_name }}"
          --notes "Unsigned self-contained x64 build. SHA-256 checksum is attached. Elevated/manual Milestone 0 acceptance checks remain pending unless the tag notes say otherwise."
